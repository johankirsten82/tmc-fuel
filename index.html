      python3 tools/apply_config.py
  (it writes manifest.json, sw.js cache/version, icons and the QR code).
  APP_ID: short, lowercase, unique per app (e.g. "purshes", "grv", "food").

          They are hidden in Settings. Keep real values out of chat/reports.
  ADMIN_ALIASES: name keys (lowercase, no spaces/dots) that mean the Admin.
====================================================================== -->

function syncNow(){
  if(!syncOn())return Promise.resolve(false);
  if(busy)return busy;
  const keys=Object.keys(dirty),sent={};
  const changes=keys.map(k=>{const r=R[k];sent[k]=r.u;return {kind:r.kind,id:r.id,u:r.u,del:r.del,data:r.data}});
  sState="busy";paintSync();
  busy=fetch(sUrl(),{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"sync",code:sCode(),device:dev,since:+(L.get("since")||0),changes:changes})})

    if(!j||!j.ok)throw new Error(j&&j.error||"sync");
    Object.keys(sent).forEach(k=>{if(R[k]&&R[k].u===sent[k])delete dirty[k]});

      let d=s.data;if(typeof d==="string"){try{d=d?JSON.parse(d):null}catch(e){d=null}}R[k]={kind:s.kind,id:String(s.id),u:u,del:s.del?1:0,data:d}});
    L.set("since",String(j.now||Date.now()));L.set("lastOk",String(Date.now()));saveR();fails=0;sState="ok";return true})
  .catch(e=>{fails++;sState="err";syncSoon(navigator.onLine?Math.min(120000,5000*Math.pow(2,fails-1)):60000);return false})
  .then(ok=>{busy=null;paintSync();try{onData()}catch(e){console.warn(e)}if(ok&&pending())syncSoon(300);return ok});
  return busy;
}

function addFail(k){const F=L.j("pinFail",{});F[k]=fails_(k).concat([Date.now()]);L.sj("pinFail",F)}
function clearFail(k){const F=L.j("pinFail",{});delete F[k];L.sj("pinFail",F)}

  const f=flow||{s:"name"};
  if(f.s==="loading")return card(`<h2>${esc(t("loading"))}</h2>`);
  if(f.s==="net")return card(`<h2>📶 ${esc(t("netT"))}</h2><p class="hint">${esc(t("netH"))}</p><button type="button" id="fRetry">${esc(t("retry"))}</button><button type="button" class="sec" id="fOther">${esc(t("other"))}</button>`);
  if(f.s==="pin")return card(`<h2>${esc(t("pinT"))}</h2><p><b>${esc(f.u.name)}</b></p>${pinInput("fPin",t("pin"))}<p class="err" id="fErr"></p><button type="button" id="fGo">${esc(t("go"))}</button><button type="button" class="sec" id="fOther">${esc(t("other"))}</button>`);
  if(f.s==="set")return card(`<h2>${esc(f.setup?t("setupT"):t("setT"))}</h2><p><b>${esc(f.u.name)}</b></p><p class="hint">${esc(f.setup?t("setupH"):t("setH"))}</p>${pinInput("fPin",t("pin"))}${pinInput("fPin2",t("pin2"))}<p class="err" id="fErr"></p><button type="button" id="fSet">${esc(t("save"))}</button><button type="button" class="sec" id="fOther">${esc(t("other"))}</button>`);

  if(f.s==="rej")return card(`<h2>❌ ${esc(t("rejT"))}</h2><p class="hint">${esc(t("rejH"))}</p><button type="button" class="sec" id="fOther">${esc(t("other"))}</button>`);
  if(f.s==="blk")return card(`<h2>⛔ ${esc(t("blkT"))}</h2><p class="hint">${esc(t("blkH"))}</p><button type="button" class="sec" id="fOther">${esc(t("other"))}</button>`);

}
function err(m){const e=$("fErr");if(e){e.textContent=m;e.style.display="block"}}
function bindCommon(){
  document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;L.set("lang",lang);render()});
  document.querySelectorAll("[data-eye]").forEach(b=>b.onclick=()=>{const i=$(b.dataset.eye);i.classList.toggle("shw")});
  bindIns();
}
function bindSignin(){
  bindCommon();
  const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
  on("fOther",()=>{flow=null;render()});
  on("fName2",()=>startName($("fName").value));
  const n=$("fName");if(n)n.onkeydown=e=>{if(e.key==="Enter")startName(n.value)};
  on("fRetry",()=>startName(flow.name));
  on("fCheck",()=>{syncNow().then(()=>lookup(flow.name))});
  on("fGo",checkPin);on("fSet",setPin);
  const p=$("fPin");if(p){p.focus();p.onkeydown=e=>{if(e.key==="Enter")(flow.s==="pin"?checkPin:setPin)()}}
}
async function startName(raw){
  const name=clean(raw);if(!name)return err(t("needName"));
  L.set("lastName",name);
  // fresh phone / reinstall: pull everything from the Sheet BEFORE matching the name
  if(syncOn()&&!(+(L.get("since")||0)>0)){flow={s:"loading",name:name};render();await syncNow();
    if(!(+(L.get("since")||0)>0)&&!users().length){flow={s:"net",name:name};render();return}}
  lookup(name);
}
function lookup(name){
  const K=NK(name),all_=users().filter(u=>NK(u.name)===K),ok=all_.filter(approved);
  if(ok.length===1){flow={s:ok[0].pinH?"pin":"set",u:ok[0],name:name};return render()}
  if(ok.length===0){
    if(all_.some(u=>u.status==="blocked")){flow={s:"blk",name:name};return render()}
    if(all_.some(u=>u.status==="rejected")){flow={s:"rej",name:name};return render()}
    if(!hasAdmin()&&K===ADMIN_KEY){flow={s:"set",setup:true,u:{id:"u"+Date.now(),name:C.ADMIN_NAME,status:"active",admin:1,dev:dev,at:new Date().toISOString()},name:name};return render()}
  }
  // no single approved match (none, or 2+ sharing the key): a normal approval request
  const own=users().find(u=>u.status==="pending"&&NK(u.name)===K&&(ok.length<2||(u.dev===dev&&clean(u.name).toLowerCase()===name.toLowerCase())));
  if(!own){const r={id:"r"+Date.now(),name:name,status:"pending",dev:dev,at:new Date().toISOString()};put("u",r.id,r)}
  flow={s:"wait",name:name};render();
}
async function checkPin(){
  const u=flow.u,k=NK(u.name),v=$("fPin").value;
  let F=fails_(k);
  if(F.length>=5){$("fPin").value="";return err(t("pinLock").replace("%m",Math.max(1,Math.ceil((F[0]+36e5-Date.now())/6e4))))}
  if(await H(v,u.salt)===u.pinH){clearFail(k);L.set("uid",u.id);L.set("uok",u.id+":"+u.pinH);tab="home";flow=null;render();return}
  addFail(k);F=fails_(k);$("fPin").value="";
  err(F.length>=5?t("pinLock").replace("%m",60):t("pinWrong"));
}
async function setPin(){
  const a=$("fPin").value,b=$("fPin2").value;
  if(!/^[0-9]{4,6}$/.test(a))return err(t("pinBad"));if(a!==b)return err(t("pinDiff"));
  const u=Object.assign({},flow.u),salt=Math.random().toString(36).slice(2,12);u.salt=salt;u.pinH=await H(a,salt);
  put("u",u.id,u);L.set("uid",u.id);L.set("uok",u.id+":"+u.pinH);tab="home";flow=null;render();
}

const LIM0={usePct:25,minGapH:4,minKm:50,minHr:2,svcKm:500,svcHr:50};
const LIMK=Object.keys(LIM0);
function limits(){const r=all("cfg").find(c=>c&&c.id==="limits")||{},o={};LIMK.forEach(k=>{const n=num(r[k]);o[k]=isFinite(n)&&n>=0?n:LIM0[k]});return o}
function fuelWarn(v,prev,e,lim){lim=lim||limits();
  const W=[],m=num(e.meter),l=num(e.litres),h=isH(v);
  if(!v)return W;
  if(num(v.tank)>0&&l>num(v.tank))W.push({k:"wTank",a:fmt(l),b:fmt(num(v.tank))});
  const pm=prev?num(prev.meter):num(v.m0);
  if(isFinite(pm)&&isFinite(m)){
    const d=m-pm;
    if(d<0)W.push({k:"wBack",a:fmt(m),b:fmt(pm)});
    else if(prev){
      const exp=num(v.exp);
      if(d>0&&exp>0&&isFinite(l)){const use=h?l/d:l/d*100;if(use>exp*(1+lim.usePct/100))W.push({k:"wUse",a:fmt(use)+" "+unitU(v),b:fmt(exp)+" "+unitU(v)})}
      const gap=(e.at-prev.at)/36e5;
      if(gap<lim.minGapH||d<(h?lim.minHr:lim.minKm))W.push({k:"wSoon",a:t("hAgo").replace("%n",fmt(gap)),b:(h?t("hrAgo"):t("kmAgo")).replace("%n",fmt(d))});
    }
  }
  const sv=num(v.svc);if(sv>0&&isFinite(m)&&sv-m<=(h?lim.svcHr:lim.svcKm))W.push({k:"wSvc",a:fmt(m)+" "+unitM(v),b:fmt(sv)+" "+unitM(v)});
  return W;
}
function canSave(s){return !!(s&&s.vid&&s.p1&&s.p2&&num(s.m)>=0&&num(s.l)>0)}
function tankMoves(){
  const M=all("d").map(d=>({at:d.at,q:num(d.litres),d:d,kind:"d"})).concat(all("f").map(f=>({at:f.at,q:-num(f.litres),d:f,kind:"f"})));
  M.sort((a,b)=>a.at-b.at);let b=0;M.forEach(m=>{b+=isFinite(m.q)?m.q:0;m.bal=b});return M;
}
const tankBalance=()=>{const M=tankMoves();return M.length?M[M.length-1].bal:0};
function isoWeek(ms){const d=new Date(ms);d.setHours(0,0,0,0);d.setDate(d.getDate()+3-(d.getDay()+6)%7);const w1=new Date(d.getFullYear(),0,4);
  const w=1+Math.round(((d-w1)/864e5-3+(w1.getDay()+6)%7)/7);return d.getFullYear()+"-W"+String(w).padStart(2,"0")}
function reports(){

  const prevOf={};

    let d=0,lu=0;if(p){const dd=num(f.meter)-num(p.meter);if(dd>0){d=dd;lu=l}}prevOf[f.vid]=f;
    const a=byV[f.vid]||(byV[f.vid]={vehicle:(v.fleet||"?")+" "+(v.model||""),unit:h?"h":"km",fills:0,litres:0,dist:0,lu:0,warnings:0});
    a.fills++;a.litres+=l;a.dist+=d;a.lu+=lu;a.warnings+=nw;
    const b=byD[f.by]||(byD[f.by]={driver:f.by,fills:0,litres:0,km:0,hours:0,warnings:0});b.fills++;b.litres+=l;b[h?"hours":"km"]+=d;b.warnings+=nw;
    const wk=isoWeek(f.at),c=byW[wk]||(byW[wk]={week:wk,fills:0,litres:0,km:0,hours:0,warnings:0});c.fills++;c.litres+=l;c[h?"hours":"km"]+=d;c.warnings+=nw;});
  const veh=Object.keys(byV).map(k=>{const a=byV[k];a.use=a.dist>0?r1(a.unit==="h"?a.lu/a.dist:a.lu/a.dist*100):null;a.useUnit=a.unit==="h"?"L/h":"L/100km";a.litres=r1(a.litres);a.dist=r1(a.dist);delete a.lu;return a});

function shrink(file,max){return new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");
  c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",0.55))};im.onerror=no;im.src=fr.result};fr.onerror=no;fr.readAsDataURL(file)})}

// Deletes ONLY this app's keys, caches and service worker. Other TMC apps are untouched.
async function wipeThisApp(){
  Object.keys(localStorage).filter(k=>k.indexOf(P)===0).forEach(k=>localStorage.removeItem(k));
  try{const ks=await caches.keys();await Promise.all(ks.filter(k=>k.indexOf(CACHE_PREFIX)===0).map(k=>caches.delete(k)))}catch(e){}
  try{const rg=await navigator.serviceWorker.getRegistration("./");if(rg&&new URL(rg.scope).href===new URL("./",location.href).href)await rg.unregister()}catch(e){}
}

if("serviceWorker" in navigator&&location.protocol!=="file:"){
  let reloading=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloading)return;reloading=true;location.reload()});
  navigator.serviceWorker.register("sw.js",{scope:"./"}).then(r=>{reg=r;
    const watch=w=>{if(!w)return;w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller){updReady=true;paintUpd()}})};
    if(r.waiting&&navigator.serviceWorker.controller){updReady=true;paintUpd()}
    watch(r.installing);r.addEventListener("updatefound",()=>watch(r.installing));
    setInterval(()=>checkUpdate(),30*60000);
  }).catch(e=>console.warn("sw",e));
}

/* SPELLCHECK START — phone spellcheck on every free-text box (names, items, notes).
   Never on PIN / number / sync / code / masked fields. Covers boxes built later too. */
(function(){
  var SKIP=/pin|url|code|sync|pass|qty|price|amount|num|date|email|phone|tel/i;
  function want(el){
    if(el.hasAttribute("data-nospell")||el.classList.contains("msk")||el.classList.contains("mk")||el.readOnly||(el.getAttribute("autocapitalize")||"")==="characters")return false;
    if(el.tagName==="TEXTAREA")return true;
    var ty=(el.getAttribute("type")||"text").toLowerCase();
    if(ty!=="text"&&ty!=="search")return false;
    var im=(el.getAttribute("inputmode")||"").toLowerCase();
    if(im==="numeric"||im==="decimal"||im==="tel"||im==="email"||im==="url")return false;
    if(SKIP.test((el.id||"")+" "+(el.name||"")+" "+(el.className||"")))return false;
    return true;
  }
  function fix(el){
    if(!want(el)){if(el.tagName==="INPUT"||el.tagName==="TEXTAREA"){el.spellcheck=false;el.setAttribute("spellcheck","false")}return}
    el.spellcheck=true;el.setAttribute("spellcheck","true");el.setAttribute("autocorrect","on");
    var nm=/name|who/i.test((el.id||"")+" "+(el.name||""))&&el.tagName!=="TEXTAREA";
    el.setAttribute("autocapitalize",nm?"words":"sentences");
  }
  function scan(root){if(!root||!root.querySelectorAll)return;if(root.matches&&root.matches("input,textarea"))fix(root);root.querySelectorAll("input,textarea").forEach(fix)}
  window.TMC_spell=scan;
  function go(){scan(document.body);new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(scan)})}).observe(document.body,{childList:true,subtree:true})}
  if(document.body)go();else document.addEventListener("DOMContentLoaded",go);
})();
/* SPELLCHECK END */
