<!-- =====================================================================

      python3 tools/apply_config.py
  (it writes manifest.json, sw.js cache/version, icons and the QR code).
  APP_ID: short, lowercase, unique per app (e.g. "purshes", "grv", "food").
          Every storage key, cache, manifest id and SW is namespaced by it,
          so apps on the same site / same phone never share data.
  CACHE_PREFIX (optional): cache name start, lowercase letters/digits and
          single hyphens (e.g. "tmc-fuel" gives caches "tmc-fuel-v1").
          Defaults to APP_ID. Storage keys always use APP_ID (no hyphens).
  SYNC_URL: this app's own Google Apps Script /exec link. Put it HERE so a
          fresh install is connected at once (the link is public, that's fine).
  SYNC_CODE: leave EMPTY (VER 4+). Phones then sign in with name + PIN and
          get a session token from the script. A code is only for old apps;
          it can also arrive by a join link  .../#k=CODE  (saved, then wiped
          from the address bar). Never put a real code in a public repo.
  ADMIN_ALIASES: name keys (lowercase, no spaces/dots) that mean the Admin.
====================================================================== -->

async function srvLookup(name,reg){

  const st=j.state;
  if(st==="active"){const u=users().find(x=>x.id===j.id)||{id:j.id,name:j.name};flow={s:j.hasPin?"pin":"set",u:Object.assign({},u,{name:j.name,salt:j.salt||u.salt}),name:name,srv:1};return render()}

  if(st==="blocked"){flow={s:"blk",name:name};return render()}
  if(st==="rejected"){flow={s:"rej",name:name};return render()}

function lookup(name,localOnly){

    if(all_.some(u=>u.status==="rejected")){flow={s:"rej",name:name};return render()}

    if(j){addFail(k);$("fPin").value="";return err(j.error==="locked"?t("pinLock").replace("%m",Math.max(1,Math.ceil(((j.until||Date.now()+36e5)-Date.now())/6e4))):t("pinWrong"))}}

async function setPin(){

const num=x=>{const v=parseFloat(String(x==null?"":x).replace(",","."));return isFinite(v)?v:NaN};
const r1=x=>Math.round(x*10)/10;
const fmt=x=>isFinite(x)?String(r1(x)):"—";
const tr=(k,a,b)=>t(k).replace("%a",a).replace("%b",b);
const vehs=()=>all("v").slice().sort((a,b)=>String(a.fleet).localeCompare(String(b.fleet)));
const fills=()=>all("f").slice().sort((a,b)=>a.at-b.at);
const phMap=()=>{const m={};all("ph").forEach(p=>{if(p&&p.id)m[p.id]=p.d});return m};
const isH=v=>v&&v.mt==="h";
const unitM=v=>isH(v)?t("hr"):t("km");
const unitU=v=>isH(v)?t("perH"):t("per100");

/* ---- pure logic (tested) ---- */
function lastFill(vid,beforeAt,exceptId){let p=null;fills().forEach(f=>{if(f.vid===vid&&f.id!==exceptId&&f.at<=beforeAt&&(!p||f.at>=p.at))p=f});return p}
// Warning limits: Admin can change them in Settings. Stored as synced record cfg:limits (in fuel_recs).
const LIM0={usePct:25,minGapH:4,minKm:50,minHr:2,svcKm:500,svcHr:50,burnPct:30};
const LIMK=Object.keys(LIM0);
function limits(){const r=all("cfg").find(c=>c&&c.id==="limits")||{},o={};LIMK.forEach(k=>{const n=num(r[k]);o[k]=isFinite(n)&&n>=0?n:LIM0[k]});return o}
function fuelWarn(v,prev,e,lim){lim=lim||limits();
  const W=[],m=num(e.meter),l=num(e.litres),h=isH(v);
  if(!v)return W;
  if(num(v.tank)>0&&l>num(v.tank))W.push({k:"wTank",a:fmt(l),b:fmt(num(v.tank))});
  const pm=prev?num(prev.meter):num(v.m0);
  if(isFinite(pm)&&isFinite(m)){
    const d=m-pm;
    if(d<0)W.push({k:"wBack",a:fmt(m),b:fmt(pm)});
    else if(prev){
      const exp=num(v.exp);
      if(d>0&&exp>0&&isFinite(l)){const use=h?l/d:l/d*100;if(use>exp*(1+lim.usePct/100))W.push({k:"wUse",a:fmt(use)+" "+unitU(v),b:fmt(exp)+" "+unitU(v)})}
      const gap=(e.at-prev.at)/36e5;
      if(gap<lim.minGapH||d<(h?lim.minHr:lim.minKm))W.push({k:"wSoon",a:t("hAgo").replace("%n",fmt(gap)),b:(h?t("hrAgo"):t("kmAgo")).replace("%n",fmt(d))});
    }
  }
  const sv=num(v.svc);if(sv>0&&isFinite(m)&&sv-m<=(h?lim.svcHr:lim.svcKm))W.push({k:"wSvc",a:fmt(m)+" "+unitM(v),b:fmt(sv)+" "+unitM(v)});
  return W;
}
// v18: the tank must be picked (no default) and the pump meter reading (running total) is REQUIRED for every fill-up.
const hasNum=x=>String(x==null?"":x).trim()!==""&&isFinite(num(x));
// v26: pump meter typed = litres typed (both filled in) – almost always the litres typed twice
function x26Same(l,bm){return hasNum(l)&&hasNum(bm)&&num(l)>0&&Math.abs(num(l)-num(bm))<0.005}
function canSave(s){return !!(s&&s.vid&&s.p1&&s.p2&&num(s.m)>=0&&num(s.l)>0&&s.tk&&(typeof tkById!=="function"||tkById(s.tk))&&hasNum(s.bm)&&num(s.bm)>=0)}
// v7: several storage tanks (kind "st"). Two built in (Admin can edit them): Main tank and the mobile Bowser 3000 L with its own meter.
// Deliveries d and fill-ups f carry tk (no tk = Main). Transfers tx {from,to,litres,m1,m2 = bowser meter before/after}.
const TK0=[{id:"main",nk:"tkMainN",cap:10000,site:"HQ",meter:false,mobile:false},{id:"gz1",nk:"tkGz1N",cap:20000,site:"GZ",meter:false,mobile:false},{id:"gz2",nk:"tkGz2N",cap:20000,site:"GZ",meter:false,mobile:false},{id:"bowser",nk:"tkBowN",cap:3000,site:"10 Alfa Camp",meter:true,mobile:true}];
function tanks(){const o={};TK0.forEach(x=>o[x.id]=Object.assign({},x));all("st").forEach(x=>{if(x&&x.id)o[x.id]=Object.assign({},o[x.id]||{},x)});
  return Object.keys(o).map(k=>o[k]).filter(x=>!x.off).sort((a,b)=>(TK0.findIndex(t=>t.id===a.id)+1||99)-(TK0.findIndex(t=>t.id===b.id)+1||99)||String(tkN(a)).localeCompare(String(tkN(b))))}
const tkN=x=>x?(x.name||(x.nk?t(x.nk):x.id)):"?";
const tkById=id=>tanks().find(x=>x.id===(id||"main"))||null;
const tkOf=x=>(x&&x.tk)||"main";
function tankMoves(tk){tk=tk||"main";const M=[],T=tkById(tk),cap=T?num(T.cap):NaN;
  all("d").forEach(d=>{if(tkOf(d)===tk)M.push({at:d.at,q:num(d.litres),d:d,kind:"d"})});
  all("tx").forEach(x=>{if(x.to===tk)M.push({at:x.at,q:num(x.litres),d:x,kind:"tx"});if((x.from||"main")===tk)M.push({at:x.at,q:-num(x.litres),d:x,kind:"tx"})});
  all("f").forEach(f=>{if(tkOf(f)===tk)M.push({at:f.at,q:-num(f.litres),d:f,kind:"f"})});

/* SPELLCHECK START — phone spellcheck on every free-text box (names, items, notes).
   Never on PIN / number / sync / code / masked fields. Covers boxes built later too. */
(function(){
  var SKIP=/pin|url|code|sync|pass|qty|price|amount|num|date|email|phone|tel/i;
  function want(el){
    if(el.hasAttribute("data-nospell")||el.classList.contains("msk")||el.classList.contains("mk")||el.readOnly||(el.getAttribute("autocapitalize")||"")==="characters")return false;
    if(el.tagName==="TEXTAREA")return true;
    var ty=(el.getAttribute("type")||"text").toLowerCase();
    if(ty!=="text"&&ty!=="search")return false;
    var im=(el.getAttribute("inputmode")||"").toLowerCase();
    if(im==="numeric"||im==="decimal"||im==="tel"||im==="email"||im==="url")return false;
    if(SKIP.test((el.id||"")+" "+(el.name||"")+" "+(el.className||"")))return false;
    return true;
  }
  function fix(el){
    if(!want(el)){if(el.tagName==="INPUT"||el.tagName==="TEXTAREA"){el.spellcheck=false;el.setAttribute("spellcheck","false")}return}
    el.spellcheck=true;el.setAttribute("spellcheck","true");el.setAttribute("autocorrect","on");
    var nm=/name|who/i.test((el.id||"")+" "+(el.name||""))&&el.tagName!=="TEXTAREA";
    el.setAttribute("autocapitalize",nm?"words":"sentences");
  }
  function scan(root){if(!root||!root.querySelectorAll)return;if(root.matches&&root.matches("input,textarea"))fix(root);root.querySelectorAll("input,textarea").forEach(fix)}
  window.TMC_spell=scan;
  function go(){scan(document.body);new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(scan)})}).observe(document.body,{childList:true,subtree:true})}
  if(document.body)go();else document.addEventListener("DOMContentLoaded",go);
})();
